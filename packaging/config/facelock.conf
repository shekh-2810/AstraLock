# ============================================================
#  AstraLock v3 — /etc/facelock/facelock.conf
#
#  Edit this file then restart the daemon to apply changes:
#    sudo systemctl restart facelockd
#
#  All keys are optional — commented-out lines show the
#  compiled-in default value.
# ============================================================

# ── IPC ──────────────────────────────────────────────────────
SOCKET_PATH=/run/facelock/facelock.sock

# ── Storage ───────────────────────────────────────────────────
DATA_DIR=/var/lib/facelock

# ── Models ────────────────────────────────────────────────────
ONNX_MODEL_PATH=/usr/share/facelock/models/w600k_mbf.onnx
DETECTOR_MODEL_PATH=/usr/share/facelock/models/retinaface.onnx
# DETECTOR_CONFIDENCE=0.6
# DETECTOR_NMS=0.3

# ── Camera ───────────────────────────────────────────────────
# Run: ls /dev/video*  to find your camera index.
# Built-in webcam is usually 0. IR cameras are often 2 or higher.
CAMERA_DEVICE=0

# ── Scoring ───────────────────────────────────────────────────
# Global fallback threshold (cosine distance — lower = stricter).
# Per-user threshold calibrated at enroll time takes priority over this.
# 0.30 = strict,  0.40 = balanced,  0.50 = permissive
ONNX_THRESHOLD=0.40

# ── Enrollment ────────────────────────────────────────────────
# ENROLL_TARGET=20
# ENROLL_MIN=10
# Per-user threshold = mean_dist + K * std_dist over enrollment set.
# Higher K = more permissive for users with natural variance (glasses etc).
# ENROLL_THRESHOLD_K=1.5

# ── Liveness (anti-spoofing) ────────────────────────────────────
# NOT YET ENFORCED. This is reserved config for an upcoming texture +
# blink-based anti-spoofing check (printed photos, phone screens, video
# replay). The capture pipeline does not currently perform any liveness
# check regardless of this setting — do not rely on it for security.
# Left here so existing configs keep the key when the feature ships.
LIVENESS_ENABLED=false
# LIVENESS_TEXTURE_MIN=0.15
# LIVENESS_BLINK_FRAMES=12
# LIVENESS_EAR_THRESHOLD=0.22

# ── Performance ───────────────────────────────────────────────
# IPC_THREADS=4
# CAMERA_WARMUP_FRAMES=5

# ── PAM feedback ─────────────────────────────────────────────
# Minimum time (ms) the "scanning face..." message stays on screen before
# being replaced by the result. Prevents the daemon (cached model, already-
# open camera) from finishing faster than the greeter can render the
# message. 0 disables the floor.
# PAM_MIN_SCAN_DISPLAY_MS=600
